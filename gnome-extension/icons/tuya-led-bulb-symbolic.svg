<?xml version="1.0" encoding="UTF-8"?>
<!-- Bulb icon for the Tuya LED toggle, drawn in the Adwaita symbolic style:
     16x16 grid, monochrome filled shapes. The root fill="#2e3436" is the
     canonical symbolic foreground: GNOME Shell recolors it to the theme
     foreground automatically (white in dark style, dark in light style),
     so this must stay a single symbolic-palette fill — never default
     black and never a FileIcon gicon (both bypass recoloring). -->
<svg height="16px" viewBox="0 0 16 16" width="16px" fill="#2e3436" xmlns="http://www.w3.org/2000/svg">
    <!-- rays -->
    <rect x="7.4" y="0" width="1.2" height="1.25" rx="0.6"/>
    <rect x="3.28" y="1.28" width="1.2" height="1.7" rx="0.6" transform="rotate(-45 3.88 2.13)"/>
    <rect x="11.52" y="1.28" width="1.2" height="1.7" rx="0.6" transform="rotate(45 12.12 2.13)"/>
    <!-- glass: ring, outer R 4.4 / inner R 3.1 around (8, 6.2) -->
    <path fill-rule="evenodd" d="M 3.6 6.2 A 4.4 4.4 0 1 0 12.4 6.2 A 4.4 4.4 0 1 0 3.6 6.2 Z M 4.9 6.2 A 3.1 3.1 0 1 1 11.1 6.2 A 3.1 3.1 0 1 1 4.9 6.2 Z"/>
    <!-- neck -->
    <rect x="6.2" y="9.2" width="3.6" height="1.5" rx="0.45"/>
    <!-- screw base: two bars -->
    <rect x="6.2" y="11.2" width="3.6" height="0.7" rx="0.35"/>
    <rect x="6.2" y="12.3" width="3.6" height="0.7" rx="0.35"/>
    <!-- bottom contact -->
    <rect x="7.2" y="13.4" width="1.6" height="1" rx="0.5"/>
</svg>
